[project]
name = "pysicp"
version = "0.1.0"
description = "SICP rewriten in Python"
authors = [
    { name = "Andrew Mosson", email = "amosson@modelyrd.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
keywords = ["sicp", "scheme", "translation", "recursion", "tail-call"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/amosson/pysicp"
Source = "https://github.com/amosson/pysicp"
Issues = "https://github.com/amosson/pysicp/issues"

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysicp"]

# The book, its build machinery and the vendored upstream are not part of the
# installable package; an sdist that carried them would be most of a gigabyte.
[tool.hatch.build.targets.sdist]
include = ["src/pysicp", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["vendor", "book", "docs", "outputs", "build", "scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pysicp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
